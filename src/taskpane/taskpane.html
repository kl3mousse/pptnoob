<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pptNoob</title>
    <style>
      :root {
        color-scheme: light;
        --accent: #d24726;
        --accent-hover: #b83a1f;
        --border: #dedede;
        --muted: #666;
      }
      body {
        font-family: Aptos, "Segoe UI", sans-serif;
        margin: 0;
        padding: 18px;
        background: #fff;
        color: #242424;
      }
      h1 { font-size: 1.35rem; margin: 0 0 18px; }
      h2 { font-size: 1rem; margin: 0; }
      button {
        padding: 8px 16px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
      }
      button:hover { background: var(--accent-hover); }
      .actions { display: flex; flex-direction: column; gap: 10px; }
      .section { margin-top: 24px; }
      .picker-toolbar {
        display: grid;
        grid-template-columns: 1fr 36px;
        gap: 8px;
        margin: 12px 0;
      }
      #iconSearch {
        min-width: 0;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font: inherit;
      }
      #iconColor {
        width: 36px;
        height: 36px;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }
      .icon-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
        gap: 8px;
      }
      .icon-button {
        min-height: 92px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 6px;
        background: #fff;
        color: #242424;
        border: 1px solid var(--border);
      }
      .icon-button:hover { background: #f7f7f7; border-color: #aaa; }
      .icon-button img { width: 36px; height: 36px; }
      .icon-button span { font-size: 0.75rem; line-height: 1.2; }
      #emptyIcons { color: var(--muted); font-size: 0.85rem; }
      #status { margin-top: 16px; font-size: 0.85rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <h1>pptNoob</h1>
    <div class="actions">
      <button id="openFolderBtn">Open containing folder</button>
    </div>
    <section class="section" aria-labelledby="iconsHeading">
      <h2 id="iconsHeading">Insert icon</h2>
      <div class="picker-toolbar">
        <input id="iconSearch" type="search" placeholder="Search icons" aria-label="Search icons" />
        <input id="iconColor" type="color" value="#242424" aria-label="Icon color" title="Icon color" />
      </div>
      <div id="iconGrid" class="icon-grid"></div>
      <p id="emptyIcons" hidden>No matching icons.</p>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </body>
</html>
